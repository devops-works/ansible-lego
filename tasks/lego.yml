---
# Assets of a release are named lego_v<version>_linux_<arch>.tar.gz and come
# with lego_<version>_checksums.txt (sha256).
- name: Downloads lego {{ lego_version }}
  ansible.builtin.get_url:
    url: "https://github.com/go-acme/lego/releases/download/v{{ lego_version }}/lego_v{{ lego_version }}_linux_{{ lego_arch }}.tar.gz"
    checksum: "sha256:https://github.com/go-acme/lego/releases/download/v{{ lego_version }}/lego_{{ lego_version }}_checksums.txt"
    dest: "/tmp/lego_v{{ lego_version }}_linux_{{ lego_arch }}.tar.gz"
    mode: "0644"

- name: Unpacks lego {{ lego_version }}
  ansible.builtin.unarchive:
    src: "/tmp/lego_v{{ lego_version }}_linux_{{ lego_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    include:
      - lego

- name: Installs lego {{ lego_version }}
  ansible.builtin.copy:
    src: /tmp/lego
    remote_src: true
    dest: /usr/local/bin/lego
    owner: root
    group: root
    mode: "0755"

- name: Removes the unpacked binary
  ansible.builtin.file:
    path: /tmp/lego
    state: absent
