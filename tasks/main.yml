---
- name: Checks if lego is already present
  ansible.builtin.stat:
    path: /usr/local/bin/lego
  register: __lego
  tags:
    - always

- ansible.builtin.include_tasks:
    file: lego.yml
    apply:
      tags:
        - lego
  when: __lego is defined and (not __lego.stat.exists or lego_force_install)
  tags:
    - always

